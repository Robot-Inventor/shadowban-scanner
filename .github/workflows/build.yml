name: Build

on:
    push:
        branches: [gh-pages]
    pull_request:
        branches: [gh-pages]

jobs:
    build:
        runs-on: ubuntu-latest

        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v7
            - uses: oven-sh/setup-bun@v2

            - run: bun install --frozen-lockfile
            - run: bun run build
